<body>
<nav>

<button class="menu-toggle" aria-label="Open menu">
    <span>☰</span>
</button>
    <div class="nav-links">
        <a href="portfolio.html">Portfolio</a>

</nav>
    <h1>Portfolio</h1>

<section id="drawings">
    <h2>Drawings & Paintings</h2>
<div class="portfolio-gallery drawing-gallery">
    <img src="drawing-05.webp" alt="Drawing" class="portfolio-image">
    <img src="drawing-01.webp" alt="Drawing" class="portfolio-image">
    <img src="drawing-03.webp" alt="Drawing" class="portfolio-image">
    <img src="drawing-02.webp" alt="Drawing" class="portfolio-image">
    <img src="drawing-04.webp" alt="Drawing" class="portfolio-image">
    
</div>
    <div class="instagram-section">
    <h3>More on Instagram</h3>

    <div class="instagram-posts">
       <blockquote class="instagram-media"
        data-instgrm-permalink="https://www.instagram.com/p/CDTBvhgnRDy/"
        data-instgrm-version="14">
    </blockquote>

    <script async src="https://www.instagram.com/embed.js"></script>
    </div>
</div>
</section>

<section id="moving-image">
    <h2>Moving Image</h2>
</section>

<section id="photography">
    <h2>Photography</h2>
<div class="portfolio-gallery photography-gallery">
    <img src="photo-01.webp" alt="Photography" class="portfolio-image">
    <img src="photo-03.webp" alt="Photography" class="portfolio-image">

</div>

</section>
<footer>
    <p>© 2026 Eveliina Lintula</p>
</footer>
<script>
    const menuButton = document.querySelector(".menu-toggle");
    const navLinks = document.querySelector(".nav-links");
    const menuIcon = menuButton.querySelector("span");

    menuButton.addEventListener("click", () => {
        navLinks.classList.toggle("open");

        if (navLinks.classList.contains("open")) {
            menuIcon.textContent = "×";
            menuButton.setAttribute("aria-label", "Close menu");
        } else {
            menuIcon.textContent = "☰";
            menuButton.setAttribute("aria-label", "Open menu");
        }
    });
</script>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close">×</button>

    <button class="lightbox-arrow lightbox-prev" aria-label="Previous image">‹</button>

    <img src="" alt="" id="lightbox-image">

    <button class="lightbox-arrow lightbox-next" aria-label="Next image">›</button>
</div>

<script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const closeButton = document.querySelector(".lightbox-close");
    const prevButton = document.querySelector(".lightbox-prev");
    const nextButton = document.querySelector(".lightbox-next");

    let currentImage = 0;
    let currentGallery = [];

    function showImage(index) {
        currentImage = (index + currentGallery.length) % currentGallery.length;

        lightboxImage.src = currentGallery[currentImage].src;
        lightboxImage.alt = currentGallery[currentImage].alt;
    }

    function openLightbox(gallery, index) {
        currentGallery = gallery;
        lightbox.classList.add("active");
        showImage(index);
    }

    document.querySelectorAll(".drawing-gallery").forEach(gallery => {
        const images = Array.from(gallery.querySelectorAll(".portfolio-image"));

        images.forEach((image, index) => {
            image.addEventListener("click", () => {
                openLightbox(images, index);
            });
        });
    });

    document.querySelectorAll(".photography-gallery").forEach(gallery => {
        const images = Array.from(gallery.querySelectorAll(".portfolio-image"));

        images.forEach((image, index) => {
            image.addEventListener("click", () => {
                openLightbox(images, index);
            });
        });
    });

    prevButton.addEventListener("click", event => {
        event.stopPropagation();
        showImage(currentImage - 1);
    });

    nextButton.addEventListener("click", event => {
        event.stopPropagation();
        showImage(currentImage + 1);
    });

    closeButton.addEventListener("click", () => {
        lightbox.classList.remove("active");
    });

    lightbox.addEventListener("click", event => {
        if (event.target === lightbox) {
            lightbox.classList.remove("active");
        }
    });
</script>

</body>
</html>
